<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%" style="background:#10070C; font-family: Georgia, 'Times New Roman', serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="60%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#451126" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B" />
      <stop offset="100%" stop-color="#F8F0F3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#C77B9B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="260" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g stroke="#701A3D" stroke-width="0.5" opacity="0.35">
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="800" y1="0" x2="800" y2="260"/>
    <line x1="1000" y1="0" x2="1000" y2="260"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
  </g>

  <!-- Name -->
  <text x="600" y="110" text-anchor="middle" fill="#F8F0F3" font-size="48" font-weight="bold" letter-spacing="4" filter="url(#glow)">
    PAWAN HIRAY
  </text>
  <!-- Role -->
  <text x="600" y="155" text-anchor="middle" fill="#C77B9B" font-size="20" letter-spacing="6" opacity="0.95">
    AI PRODUCT DEVELOPER · MUMBAI
  </text>
  <!-- Accent underline -->
  <rect x="480" y="168" width="240" height="4" rx="2" fill="url(#accentGrad)"/>
  <rect x="550" y="168" width="100" height="4" rx="2" fill="#F8F0F3" opacity="0.9"/>

  <!-- Small decorative orbital -->
  <circle cx="1150" cy="130" r="18" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0.6"/>
  <circle cx="1150" cy="130" r="8" fill="#701A3D" opacity="0.6"/>
</svg>
