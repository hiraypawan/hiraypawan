<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%" style="background:#10070C; font-family: Georgia, 'Times New Roman', serif;">
  <defs>
    <linearGradient id="heroBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#451126" />
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0;0;1" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B" />
      <stop offset="100%" stop-color="#F8F0F3" />
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#C77B9B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="260" fill="url(#heroBgGrad)" />

  <!-- Fine technical grid -->
  <g stroke="#701A3D" stroke-width="0.6" opacity="0.4">
    <line x1="150" y1="0" x2="150" y2="260" />
    <line x1="300" y1="0" x2="300" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="750" y1="0" x2="750" y2="260" />
    <line x1="900" y1="0" x2="900" y2="260" />
    <line x1="1050" y1="0" x2="1050" y2="260" />
    <line x1="0" y1="65" x2="1200" y2="65" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="195" x2="1200" y2="195" />
  </g>

  <!-- Restrained orbital geometry -->
  <g opacity="0.35" stroke="#C77B9B" stroke-width="1" fill="none">
    <circle cx="1080" cy="140" r="30">
      <animate attributeName="r" values="28;36;28" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="140" r="14" fill="#701A3D" stroke="none" />
  </g>

  <!-- Animated drawn path -->
  <path d="M 420 145 Q 520 110 620 145 T 820 145" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#heroGlow)">
    <animate attributeName="stroke-dasharray" values="0,300;300,0;0,300" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Name -->
  <text x="600" y="105" text-anchor="middle" fill="#F8F0F3" font-size="52" font-weight="bold" letter-spacing="5" filter="url(#heroGlow)">
    PAWAN HIRAY
  </text>

  <!-- Role line -->
  <text x="600" y="155" text-anchor="middle" fill="#C77B9B" font-size="20" letter-spacing="6" opacity="0.95">
    AI PRODUCT DEVELOPER · MUMBAI
  </text>

  <!-- Glowing underline -->
  <rect x="500" y="165" width="200" height="4" rx="2" fill="url(#accentGrad)">
    <animate attributeName="width" values="160;240;160" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
